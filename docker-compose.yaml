version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-run
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      DATABASE_NAME: tasks
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-run
      args:
        - VITE_API_URL=http://localhost:3000/api
    ports:
      - "5173:80"

  postgres:
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tasks
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
